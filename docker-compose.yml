services:

  backend:
    build:
      context: .
    container_name: expense-tracker-backend
    ports:
      - "8080:8080"
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: expense-tracker-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
